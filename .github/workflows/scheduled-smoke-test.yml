name: Scheduled Smoke Test

on:
  schedule:
    - cron: "*/5 * * * *"

jobs:
  scheduled-smoke-test:
    runs-on: ubuntu-latest
    steps:
      - name: Post scheduled smoke test message
        run: |
          node --input-type=module <<'NODE'
          import process from "node:process";

          const response = await fetch(
            `https://discord.com/api/v10/channels/${process.env.POKER_CHANNEL_ID}/messages`,
            {
              method: "POST",
              headers: {
                authorization: `Bot ${process.env.DISCORD_TOKEN}`,
                "content-type": "application/json"
              },
              body: JSON.stringify({
                content: `Scheduled GitHub Actions smoke test ran at ${new Date().toISOString()}.`
              })
            }
          );

          if (!response.ok) {
            console.error(await response.text());
            process.exit(1);
          }
          NODE
        env:
          DISCORD_TOKEN: ${{ secrets.DISCORD_TOKEN }}
          POKER_CHANNEL_ID: ${{ secrets.POKER_CHANNEL_ID }}

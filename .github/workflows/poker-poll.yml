name: Poker Poll

on:
  schedule:
    - cron: "*/15 14,15 * * 0"
  workflow_dispatch:
    inputs:
      confirm_post:
        description: "Type POST to publish a poker poll now"
        required: true

permissions:
  contents: read
  issues: write

jobs:
  post-poker-poll:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Post poker poll
        if: github.event_name == 'schedule' || inputs.confirm_post == 'POST'
        run: npx tsx src/tasks/postPokerPoll.ts
        env:
          DISCORD_TOKEN: ${{ secrets.DISCORD_TOKEN }}
          DISCORD_CLIENT_ID: ${{ secrets.DISCORD_CLIENT_ID }}
          DISCORD_GUILD_ID: ${{ secrets.DISCORD_GUILD_ID }}
          POKER_CHANNEL_ID: ${{ secrets.POKER_CHANNEL_ID }}
          TIMEZONE: America/New_York
          GITHUB_TOKEN: ${{ github.token }}
          BOT_STATE_ISSUE_NUMBER: ${{ secrets.BOT_STATE_ISSUE_NUMBER }}
          ENFORCE_POLL_WINDOW: ${{ github.event_name == 'schedule' && 'true' || 'false' }}

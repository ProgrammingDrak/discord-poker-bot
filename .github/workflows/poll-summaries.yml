name: Poll Summaries

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

jobs:
  check-poll-summaries:
    runs-on: ubuntu-latest
    steps:
      - name: Wake Render and check due poll summaries
        run: |
          curl --fail --show-error --silent \
            --request POST \
            --retry 5 \
            --retry-delay 20 \
            --max-time 120 \
            --header "Authorization: Bearer $TASK_SECRET" \
            "$BOT_BASE_URL/tasks/check-summaries"
        env:
          BOT_BASE_URL: ${{ secrets.BOT_BASE_URL }}
          TASK_SECRET: ${{ secrets.TASK_SECRET }}

name: Poll Summaries

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  check-poll-summaries:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Check poll summaries
        run: npx tsx src/tasks/checkPollSummaries.ts
        env:
          DISCORD_TOKEN: ${{ secrets.DISCORD_TOKEN }}
          DISCORD_CLIENT_ID: ${{ secrets.DISCORD_CLIENT_ID }}
          DISCORD_GUILD_ID: ${{ secrets.DISCORD_GUILD_ID }}
          POKER_CHANNEL_ID: ${{ secrets.POKER_CHANNEL_ID }}
          TIMEZONE: America/New_York
          GITHUB_TOKEN: ${{ github.token }}
          BOT_STATE_ISSUE_NUMBER: ${{ secrets.BOT_STATE_ISSUE_NUMBER }}

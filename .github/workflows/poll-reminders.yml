name: Poll Reminders

on:
  schedule:
    # Tuesday and Wednesday 12 PM America/New_York. 16:00 UTC in EDT, 17:00 UTC
    # in EST; the */15 spread absorbs GitHub's cron delay. The task picks the
    # reminder from the current day and dedupes per poll via issue state.
    - cron: "*/15 16,17 * * 2,3"
  workflow_dispatch:
    inputs:
      reminder_key:
        description: "Force a reminder now: tuesday or wednesday"
        required: false

permissions:
  contents: read
  issues: write

jobs:
  post-poll-reminder:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Post poll reminder
        run: npx tsx src/tasks/postPollReminder.ts
        env:
          DISCORD_TOKEN: ${{ secrets.DISCORD_TOKEN }}
          DISCORD_CLIENT_ID: ${{ secrets.DISCORD_CLIENT_ID }}
          DISCORD_GUILD_ID: ${{ secrets.DISCORD_GUILD_ID }}
          POKER_CHANNEL_ID: ${{ secrets.POKER_CHANNEL_ID }}
          TIMEZONE: America/New_York
          GITHUB_TOKEN: ${{ github.token }}
          BOT_STATE_ISSUE_NUMBER: ${{ secrets.BOT_STATE_ISSUE_NUMBER }}
          REMINDER_KEY: ${{ inputs.reminder_key }}

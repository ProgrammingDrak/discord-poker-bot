name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm test
      # catalog.json is what the organism dashboard reads. A registry change that
      # forgets to regenerate it would leave the brain describing a fleet that no
      # longer exists, so the check is here rather than in a review checklist.
      - name: catalog.json is current
        run: |
          npm run catalog
          git diff --exit-code catalog.json

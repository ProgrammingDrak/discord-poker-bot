services:
  - type: web
    name: boredom-bot
    runtime: node
    plan: free
    region: oregon
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /health
    autoDeployTrigger: commit
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: 24.15.0
      - key: DISCORD_TOKEN
        sync: false
      - key: DISCORD_CLIENT_ID
        value: "813148551826767893"
      - key: DISCORD_GUILD_ID
        value: "734260723919880223"
      - key: POKER_CHANNEL_ID
        value: "1464279896812421211"
      - key: TIMEZONE
        value: America/New_York
      - key: DATABASE_PATH
        value: /tmp/poker-bot.sqlite
      - key: TASK_SECRET
        sync: false
